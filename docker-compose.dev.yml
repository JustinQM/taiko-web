# Local test stack. Self-contained: named volumes only, no bind mounts to
# a host data directory, and ports offset into the 349xx range so it can
# run alongside anything else on the machine.
#
#   podman-compose -f docker-compose.dev.yml up --build
#
# There is no song audio and no real assets here, so songs are not
# playable and the UI is unstyled. That is expected — this stack exists to
# exercise the server, the database and the deployment wiring.
services:
  mongo:
    image: docker.io/library/mongo:6
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - dev_mongo:/data/db
    environment:
      MONGO_INITDB_DATABASE: taiko

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "127.0.0.1:6479:6379"
    volumes:
      - dev_redis:/data
    command: redis-server --appendonly yes

  app:
    build: .
    image: taiko-web:dev
    depends_on:
      - mongo
      - redis
    volumes:
      - ./config.dev.py:/srv/taiko-web/config.py:ro
    command: gunicorn -b 0.0.0.0:34801 --workers 3 app:app

  multiplayer:
    image: taiko-web:dev
    depends_on:
      - app
    volumes:
      - ./config.dev.py:/srv/taiko-web/config.py:ro
    command: python server.py

  nginx:
    image: taiko-web:dev
    depends_on:
      - app
      - multiplayer
    ports:
      - "127.0.0.1:34900:80"
    command: nginx -g "daemon off;"

volumes:
  dev_mongo:
  dev_redis:
