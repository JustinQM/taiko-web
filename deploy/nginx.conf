# nginx for the containerised stack. Upstreams are compose service names,
# so this only works inside the stack; tools/nginx.conf is the config for a
# single-host install where everything listens on 127.0.0.1.
server {
    listen 80;
    client_max_body_size 64M;

    location /highscores {
        rewrite ^/highscores/?(.*)$ /$1 break;
        proxy_set_header Host $host;
        proxy_pass http://highscores:8000;
    }

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://app:34801;
    }

    # Static files are served straight off disk. public/ ships in the
    # image; public/songs is a bind mount.
    #
    # Assets and source carry the build tag as a query string, so a
    # deploy changes every URL and they can be cached for good. Without
    # this the browser revalidates around 250 files on every single load,
    # which is 250 round trips to be told nothing changed.
    location ~ ^/(assets|src)/ {
        root /srv/taiko-web/public;
        # One header, not two: `expires` emits its own Cache-Control and
        # would sit alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Songs are not versioned that way -- a re-import can change a file
    # under an id that stays the same -- so they revalidate as before.
    location ~ ^/songs/ {
        root /srv/taiko-web/public;
        location ~ ^/songs/(\d+)/preview\.mp3$ {
            try_files $uri /api/preview?id=$1;
        }
    }

    location /p2 {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_pass http://multiplayer:34802;
    }
}
